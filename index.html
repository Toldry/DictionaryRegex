<!DOCTYPE html>
<html>
<head>
    <title>Dictionary Regex</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
	<link rel="shortcut icon" href="favicon.png">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="languageSidebar">
            <h4 class="sidebar-title" data-en="Languages" data-he="שפות" data-es="Idiomas" data-de="Sprachen">Languages</h4>
            <ul class="language-list" id="languageList">
                <li><a href="?lang=en" class="language-link active" data-lang-code="en">English</a></li>
                <li><a href="?lang=he" class="language-link" data-lang-code="he">עברית</a></li>
                <li><a href="?lang=es" class="language-link" data-lang-code="es">Español</a></li>
                <li><a href="?lang=de" class="language-link" data-lang-code="de">Deutsch</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="input-container">
                <h3 data-en="Dictionary Regex" data-he="מילון Regex" data-es="Diccionario Regex" data-de="Wörterbuch Regex"></h3>
                <p data-en="Enter a regular expression to search the Oxford English Dictionary" data-he="הכנס ביטוי רגולרי לחיפוש במילון העברי" data-es="Ingresa una expresión regular para buscar en el diccionario de palabras en español" data-de="Geben Sie einen regulären Ausdruck ein, um im deutschen Wörterbuch zu suchen"></p>
                
                <div class="examples-container">
                    <h4 data-en="Example Queries" data-he="דוגמאות לחיפושים" data-es="Consultas de ejemplo" data-de="Beispielabfragen"></h4>
                    <div class="example-queries">
                        <template id="exampleQueryTemplate">
                            <a href="#" class="example-query">
                                <div class="description" data-en="" data-he=""></div>
                                <div class="pattern"></div>
                            </a>
                        </template>
                    </div>
                </div>

                <input
                    id="regexTextField"
                    type="text"
                    class="input-field"
                    data-en-placeholder="Enter regex pattern..."
                    data-he-placeholder="הכנס ביטוי רגולרי..."
                    data-es-placeholder="Ingresa un patrón regex..."
                    data-de-placeholder="Regex-Muster eingeben..."
                />
                <button id="findMatchesButton" class="button" data-en="Find matches" data-he="מצא התאמות" data-es="Buscar coincidencias" data-de="Treffer suchen"></button>
                <div class="checkbox-container">
                    <label for="colorizeSubMatch" data-en="Colorize matches" data-he="צבע התאמות" data-es="Resaltar coincidencias" data-de="Treffer hervorheben"></label>
                    <input 
                        id="colorizeSubMatch" 
                        type="checkbox"
                    >
                </div>
            </div>

            <p id="errorMessage" class="error-message" data-en="Invalid regular expression" data-he="ביטוי רגולרי לא תקין" data-es="Expresión regular no válida" data-de="Ungültiger regulärer Ausdruck"></p>

            <hr/>

            <div class="results-container">
                <span data-en="Number of matches: " data-he="מספר התאמות: " data-es="Número de coincidencias: " data-de="Anzahl der Treffer: "></span>
                <span id="numberOfMatches">0</span>
                <div id="matchWarning" class="match-warning" style="display: none">
                    <p>
                        <span data-en="Showing all " data-he="הצגת כל " data-es="Mostrar todo " data-de="Das Anzeigen aller "></span>
                        <span id="totalMatchCount"></span>
                        <span data-en=" matches may cause the page to load slowly." data-he=" התאמות עלולה לגרום לטעינה איטית של הדף." data-es=" coincidencias puede hacer que la página se cargue lentamente." data-de=" Treffer kann dazu führen, dass die Seite langsam lädt."></span>
                    </p>
                    <button id="limitMatches" class="button button-secondary" data-en="Show only first 2,000 matches" data-he="הצג רק 2,000 התאמות ראשונות" data-es="Mostrar solo las primeras 2,000 coincidencias" data-de="Nur die ersten 2.000 Treffer anzeigen"></button>
                    <button id="showAll" class="button button-secondary" data-en="Show all matches anyway" data-he="הצג את כל ההתאמות בכל מקרה" data-es="Mostrar todas las coincidencias de todas formas" data-de="Trotzdem alle Treffer anzeigen"></button>
                </div>
                <ol id="matches"></ol>
            </div>
            <div class="link-container">
                <div data-en="Link to this query:" data-he="קישור לחיפוש זה:" data-es="Enlace a esta consulta:" data-de="Link zu dieser Abfrage:"></div>
                <a id="linkToQuery"></a>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
